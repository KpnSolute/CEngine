# CEngine STAGING Blueprint for Render (free plan, Docker runtime). Staging only: never point
# this at production data. No secrets are stored here; every secret is `sync: false` and is
# entered by the owner in the Render Dashboard. Instructions and open questions:
# deploy/render/STAGING.md. Not applied by anyone yet.
services:
  - type: web
    name: cengine-staging
    runtime: docker
    dockerfilePath: ./Dockerfile # the repo's existing image; see STAGING.md for the plugin-phase image
    dockerContext: .
    plan: free # sleeps when idle, no persistent disk, no shell; see STAGING.md "Free-plan limits"
    # region: oregon # OWNER DECISION: fixed after creation; choose near the external database
    branch: main
    autoDeployTrigger: "off" # staging changes ship only when the owner clicks Deploy
    healthCheckPath: /_meta/health/ready
    envVars:
      - key: PORT
        value: "8080" # the port Render routes to; must equal the port in CE_BIND
      - key: CE_BIND
        value: 0.0.0.0:8080 # the image default; ce-serve does not read PORT itself
      - key: CE_INSTALLATION
        value: mjcc-staging
      - key: CE_TEMPLATE
        value: /etc/secrets/mjcc.template.json # Render secret file: the MJCC template JSON (from MJCC-workspace)
      - key: CE_MODULE
        value: business.inventory # ce-serve adds this module to the template at start
      - key: CE_POOL_SIZE
        value: "5"
      - key: CE_DATABASE_URL
        sync: false # external NON-PRODUCTION Postgres URL
      - key: CE_JWT_KEY
        sync: false # >= 32 bytes, generated for staging only
      - key: CE_DB_TLS
        sync: false # off | webpki | ca, see STAGING.md
      - key: CE_DB_CA
        sync: false # only with CE_DB_TLS=ca; e.g. /etc/secrets/db-ca.pem (Render secret file)
      - key: CE_SCHEMA
        sync: false # the schema `ce-serve install` created, e.g. ce_mjcc_staging
      - key: CE_TENANT
        sync: false # one lowercase uuid; every token is for this tenant
      - key: CE_STAFF_FILE
        value: /etc/secrets/staff.json # Render secret file: seeds the first admin once
      - key: CE_STAFF_SOURCE
        value: postgres # staff accounts live in the installation's schema after that
