name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ce
          POSTGRES_PASSWORD: ce
          POSTGRES_DB: ce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ce -d ce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CE_TEST_DATABASE_URL: postgresql://ce:ce@127.0.0.1:5432/ce_test
      CE_REQUIRE_DB: '1'
      CE_REQUIRE_TOOLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g typescript@5.9.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reference/run_vectors.py
