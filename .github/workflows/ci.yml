name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ce
          POSTGRES_PASSWORD: ce
          POSTGRES_DB: ce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ce -d ce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CE_TEST_DATABASE_URL: postgresql://ce:ce@127.0.0.1:5432/ce_test
      CE_REQUIRE_DB: '1'
      CE_REQUIRE_TOOLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g typescript@5.9.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Python binding passes the shared vectors
        run: |
          cargo build -p ce-py
          python reference/run_bindings.py target/debug/libcengine.so
      - name: WebAssembly binding passes the shared vectors
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install --locked wasm-bindgen-cli --version 0.2.129
          cargo build -p ce-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target nodejs --out-dir target/wasm-out target/wasm32-unknown-unknown/release/ce_wasm.wasm
          node reference/run_wasm.cjs target/wasm-out

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reference/run_vectors.py
