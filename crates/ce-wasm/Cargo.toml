[package]
name = "ce-wasm"
description = "CEngine WebAssembly module (wasm-bindgen): thin wrappers over ce-bind for JavaScript"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ce-bind = { path = "../ce-bind" }
wasm-bindgen = "=0.2.129"

# jsonschema -> ahash -> getrandom: on wasm32-unknown-unknown getrandom needs this feature and
# the cfg `getrandom_backend="wasm_js"` (see the build command in the crate docs).
getrandom = { version = "0.3", features = ["wasm_js"] }
