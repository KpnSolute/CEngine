[package]
name = "ce-auth"
description = "CEngine auth: verifies Platform-issued tokens and mints the only TenantScope (draft v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets other crates' tests build a TenantScope without a token. Never enable in a release build.
test-util = []

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
