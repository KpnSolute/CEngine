[package]
name = "ce-store"
description = "CEngine store contract and in-memory reference implementation (draft v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `contract::run_all` for backends to test themselves. Test code only.
contract-tests = ["dep:base64", "dep:hmac", "dep:sha2"]

[dependencies]
ce-auth = { path = "../ce-auth" }
ce-query = { path = "../ce-query" }
serde_json = "1"
base64 = { version = "0.22", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
ce-store = { path = ".", features = ["contract-tests"] }
