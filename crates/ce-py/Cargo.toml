[package]
name = "ce-py"
description = "CEngine Python extension module `cengine` (PyO3): thin wrappers over ce-bind"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cengine"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
ce-bind = { path = "../ce-bind" }
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }
