[package]
name = "ce-store-pg"
description = "CEngine Postgres store: the Store contract on PostgreSQL (draft v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ce-store = { path = "../ce-store" }
ce-manifest = { path = "../ce-manifest" }
ce-query = { path = "../ce-query" }
ce-migrate = { path = "../ce-migrate" }
ce-validate = { path = "../ce-validate" }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde_json = "1"
sha2 = "0.10"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

[dev-dependencies]
ce-store = { path = "../ce-store", features = ["contract-tests"] }
ce-auth = { path = "../ce-auth" }
ce-tools = { path = "../ce-tools" }
base64 = "0.22"
hmac = "0.12"
