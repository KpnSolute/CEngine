[package]
name = "ce-provider-http"
description = "CEngine provider over HTTP: sends each provider request to the host's gateway (Infajn) as one JSON POST (draft v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ce-auth = { path = "../ce-auth" }
ce-provider = { path = "../ce-provider" }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
