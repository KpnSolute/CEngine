schema_version = 1

[plugin]
id = "mjcc-legacy-valuation"
version = "0.1.0"
description = "Synthetic test copy of MJCC's inventory valuation rules, as the legacy Compute backend computes them today."

[compatibility]
engine = ">=0.2.0"
module = "business.inventory"
module_api = 1

[execution]
kind = "policy-pack"

# Opening stock keeps the cost it was carried in at; when none was carried it takes the line price.
[[policy]]
slot = "opening_value"
rule = "when(opening_oh > 0, round(opening_oh * when(opening_unit_cost > 0, opening_unit_cost, price), 2), 0)"

# Value follows quantity: nothing on hand is worth nothing; otherwise the value flows
# opening + received - pulled, never below zero.
[[policy]]
slot = "ending_value"
rule = "when(ending_qty <= 0, 0, round(max(0, opening_value + received_value - pulled_value), 2))"

# Reorder list (legacy `GET /api/inventory/reorders`): units on hand are whole units, a line is low
# when it has a par above zero and fewer whole units than the par, and the shortage is par - on hand.
[[policy]]
slot = "on_hand"
rule = "floor(max(0, ending_qty))"

[[policy]]
slot = "below_par"
rule = "par_level > 0 and on_hand < par_level"

[[policy]]
slot = "shortage"
rule = "when(par_level > 0 and on_hand < par_level, par_level - on_hand, 0)"

# Synthetic copy of the fields the MJCC inventory plugin adds to the module's entities
# (plugin mjcc-inventory 0.5.0). Nothing stamps them: a client or the migration loader writes them.
[[extend]]
entity = "supplier_invoice"
field = "period"
definition = { type = "ref", ref = "period", indexed = true }

[[extend]]
entity = "supplier_invoice"
field = "week"
definition = { type = "integer", indexed = true }
