[package]
name = "ce-plugin"
description = "CEngine customer plugin contract: strict plugin.toml reader and validator (declarative policy packs)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ce-expr = { path = "../ce-expr" }
ce-manifest = { path = "../ce-manifest" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
semver = "1"
tempfile = "3"
ce-validate = { path = "../ce-validate" }
bigdecimal = "0.4"
